<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
    --series-2:       #eb6834;
    --series-3:       #1baf7a;
    --good:           #0ca30c;
    --critical:       #d03b3b;
    --good-ink:       #006300;
    --ramp: #cde2fb,#b7d3f6,#9ec5f4,#86b6ef,#6da7ec,#5598e7,#3987e5,#2a78d6,#256abf,#1c5cab,#184f95,#104281,#0d366b;
    --ramp-dir: 1;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --good-ink:       #0ca30c;
      --ramp-dir: -1;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --good-ink:       #0ca30c;
    --ramp-dir: -1;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page, #f9f9f7);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .viz-root {
    background: var(--page);
    color: var(--text-primary);
    padding: 32px 24px 80px;
    max-width: 1120px;
    margin: 0 auto;
    line-height: 1.55;
  }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h2 {
    font-size: 19px; margin: 48px 0 4px; letter-spacing: -0.01em;
    padding-top: 20px; border-top: 1px solid var(--border);
  }
  h3 { font-size: 15px; margin: 28px 0 4px; }
  p  { margin: 6px 0 0; color: var(--text-secondary); font-size: 14px; max-width: 76ch; }
  .lede { font-size: 14px; color: var(--text-secondary); }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 20px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
  .tile .v { font-size: 25px; font-weight: 600; margin-top: 2px; letter-spacing: -0.02em; }
  .tile .s { font-size: 12px; color: var(--text-secondary); }
  .ok  { color: var(--good-ink); font-weight: 600; }
  .bad { color: var(--critical); font-weight: 600; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-top: 14px;
  }
  .cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; align-items: start; }
  .scroll { overflow-x: auto; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  .attn-grid { display: grid; grid-template-columns: repeat(7, auto); gap: 4px; width: max-content; }
  .attn-grid canvas {
    width: 82px; height: 82px; image-rendering: pixelated; cursor: pointer;
    border: 1px solid var(--border); border-radius: 4px; display: block;
    background: var(--surface-1);
  }
  .attn-grid canvas.sel { outline: 2px solid var(--series-2); outline-offset: 1px; }
  .axl { font-size: 10px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }

  .heat-text { font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.85; }
  .heat-text span { padding: 1px 0; border-radius: 2px; }

  .tokline { display: flex; flex-wrap: wrap; gap: 2px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .tok {
    padding: 2px 4px; border-radius: 4px; white-space: pre;
    border: 1px solid var(--border); color: var(--text-primary);
  }

  pre.sample {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; margin: 8px 0 0; color: var(--text-secondary);
    max-height: 260px; overflow: auto;
  }

  .tip {
    position: fixed; pointer-events: none; z-index: 40; opacity: 0;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 4px 16px rgba(0,0,0,.16); transition: opacity .08s;
    font-variant-numeric: tabular-nums; max-width: 260px;
  }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 10px 0 2px; }
  .tabs button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
    cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { background: var(--series-1); color: #fff; border-color: transparent; }
  .cap { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  svg { display: block; max-width: 100%; }
  .rampbar { height: 8px; border-radius: 4px; width: 130px; display: inline-block; vertical-align: middle; }
</style>
<div class="tip" id="tip"></div>
<script>
/* ---------- shared chart chrome (theme, tooltip, line chart, heatmap) ---------- */
const $ = id => document.getElementById(id);
const tip = $('tip');
const cs = () => getComputedStyle(document.querySelector('.viz-root'));
function v(name) { return cs().getPropertyValue(name).trim(); }
function ramp() {
  const list = v('--ramp').split(',').map(s => s.trim());
  return v('--ramp-dir').trim() === '-1' ? list.slice().reverse() : list;
}
function hex2rgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function hex2rgbStr(s) { return s.match(/\d+/g).map(Number); }
/* t in [0,1] -> colour, starting from the surface so 0 recedes into the card */
function rampColor(t) {
  const steps = [v('--surface-1')].concat(ramp());
  t = Math.max(0, Math.min(1, t));
  const x = t * (steps.length - 1), i = Math.floor(x), f = x - i;
  const a = hex2rgb(steps[i]), b = hex2rgb(steps[Math.min(i+1, steps.length-1)]);
  return `rgb(${a.map((c,k)=>Math.round(c+(b[k]-c)*f)).join(',')})`;
}
/* pick black or white ink for a background, so heat cells stay readable in both themes */
function inkOn(rgbString) {
  const [r, g, b] = hex2rgbStr(rgbString).map(c => {
    c /= 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  const onBlack = (L + 0.05) / 0.05, onWhite = 1.05 / (L + 0.05);
  return onBlack >= onWhite ? '#0b0b0b' : '#ffffff';
}
/* alternating tints so token boundaries read without colour carrying meaning */
function tokStyle(i) {
  const bg = rampColor(i % 2 ? 0.08 : 0.22);
  return `background:${bg};color:${inkOn(bg)}`;
}
function decodeU8(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function showTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.style.opacity = 0;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const vis = s => s === '\n' ? '\\n' : s === '\t' ? '\\t' : s === ' ' ? '␣' : s;
function bindTips(root, selector) {
  root.querySelectorAll(selector).forEach(el => {
    if (!el.dataset.t) return;
    el.addEventListener('mousemove', e => showTip(e, el.dataset.t));
    el.addEventListener('mouseleave', hideTip);
  });
}

function lineChart(host, series, opt) {
  opt = opt || {};
  const W = opt.width || 500, H = opt.height || 230;
  const m = { t: 12, r: 14, b: 30, l: 46 };
  const xs = series.flatMap(s => s.points.map(p => p[0]));
  const ys = series.flatMap(s => s.points.map(p => p[1])).concat(opt.refValue != null ? [opt.refValue] : []);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = opt.yZero ? 0 : Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.08 || 1; y1 += pad; if (!opt.yZero) y0 -= pad;
  /* keep bounded units (percentages) from padding past their ceiling */
  if (opt.yMax != null) y1 = Math.min(y1, opt.yMax);
  if (opt.yMin != null) y0 = Math.max(y0, opt.yMin);
  /* log scale for quantities spanning an order of magnitude (perplexity, loss),
     where a linear axis buries the tail against the baseline */
  if (opt.logY) { y0 = Math.max(Math.min(...ys) * 0.85, 1e-9); y1 = Math.max(...ys) * 1.15; }
  const fy = opt.logY ? Math.log : (t => t);
  const sx = x => m.l + (x1 === x0 ? 0 : (x - x0) / (x1 - x0)) * (W - m.l - m.r);
  const sy = y => H - m.b - (fy(y) - fy(y0)) / (fy(y1) - fy(y0)) * (H - m.t - m.b);

  let g = '';
  for (let i = 0; i <= 4; i++) {
    const t = opt.logY
      ? Math.exp(fy(y0) + (fy(y1) - fy(y0)) * i / 4)
      : y0 + (y1 - y0) * i / 4;
    g += `<line x1="${m.l}" x2="${W-m.r}" y1="${sy(t).toFixed(1)}" y2="${sy(t).toFixed(1)}" stroke="${v('--grid')}" stroke-width="1"/>`;
    g += `<text x="${m.l-8}" y="${(sy(t)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="${v('--text-muted')}" style="font-variant-numeric:tabular-nums">${t.toFixed(opt.dp==null?2:opt.dp)}</text>`;
  }
  [x0, (x0+x1)/2, x1].forEach(t =>
    g += `<text x="${sx(t).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="10" fill="${v('--text-muted')}">${Math.round(t)}</text>`);
  g += `<line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="${v('--baseline')}" stroke-width="1"/>`;

  if (opt.refValue != null) {
    g += `<line x1="${m.l}" x2="${W-m.r}" y1="${sy(opt.refValue).toFixed(1)}" y2="${sy(opt.refValue).toFixed(1)}"
          stroke="${v('--critical')}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    g += `<text x="${W-m.r}" y="${(sy(opt.refValue)-6).toFixed(1)}" text-anchor="end" font-size="10" fill="${v('--critical')}">${esc(opt.refLabel)}</text>`;
  }
  if (opt.refX != null) {
    g += `<line x1="${sx(opt.refX).toFixed(1)}" x2="${sx(opt.refX).toFixed(1)}" y1="${m.t}" y2="${H-m.b}"
          stroke="${v('--text-muted')}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    g += `<text x="${(sx(opt.refX)+5).toFixed(1)}" y="${m.t+10}" font-size="10" fill="${v('--text-muted')}">${esc(opt.refXLabel)}</text>`;
  }
  series.forEach(s => {
    const d = s.points.map((p,i) => `${i?'L':'M'}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
           ${s.dashed ? 'stroke-dasharray="5 3"' : ''}/>`;
    s.points.forEach(p => g += `<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="4"
        fill="${s.color}" stroke="${v('--surface-1')}" stroke-width="2"
        data-t="${esc(s.name)} · ${esc(opt.xName||'step')} ${p[0]} · <b>${p[1].toFixed(opt.dp==null?3:opt.dp)}${opt.unit||''}</b>"/>`);
    const last = s.points[s.points.length-1];
    if (series.length <= 4 && opt.directLabel !== false)
      g += `<text x="${(sx(last[0])-4).toFixed(1)}" y="${(sy(last[1])-9).toFixed(1)}" text-anchor="end"
            font-size="10" fill="${v('--text-secondary')}">${esc(s.name)}</text>`;
  });
  /* line-shaped swatches so a dashed series is identifiable in the legend too */
  const swatch = s => `<i class="swatch" style="width:14px;height:0;border-radius:0;
      border-top:2px ${s.dashed ? 'dashed' : 'solid'} ${s.color}"></i>`;
  host.innerHTML =
    (series.length > 1 ? `<div class="legend">${series.map(s=>`<span>${swatch(s)}${esc(s.name)}</span>`).join('')}</div>` : '') +
    `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">${g}</svg>` +
    `<div class="cap">${opt.caption||''}</div>`;
  bindTips(host, 'circle');
}

/* horizontal bars: rows = [{label, value, display, note, color}] */
function barChart(host, rows, opt) {
  opt = opt || {};
  const W = opt.width || 480, rowH = 34, labelW = opt.labelW || 96;
  const H = rows.length * rowH + 10;
  const max = Math.max(...rows.map(r => r.value)) * 1.02;
  let g = '';
  rows.forEach((r, i) => {
    const w = Math.max(2, r.value / max * (W - labelW - 92));
    g += `<text x="0" y="${i*rowH+22}" font-size="12" fill="${v('--text-primary')}">${esc(r.label)}</text>`;
    g += `<rect x="${labelW}" y="${i*rowH+8}" width="${w.toFixed(1)}" height="18" rx="4" fill="${r.color || v('--series-1')}"
           data-t="<b>${esc(r.label)}</b> · ${esc(r.display)}${r.note ? '<br>'+esc(r.note) : ''}"/>`;
    g += `<text x="${labelW + w + 8}" y="${i*rowH+22}" font-size="12" fill="${v('--text-secondary')}"
           style="font-variant-numeric:tabular-nums">${esc(r.display)}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}</svg>` +
    `<div class="cap">${opt.caption||''}</div>`;
  bindTips(host, 'rect');
}

function drawHeat(canvas, bytes, n) {
  canvas.width = n; canvas.height = n;
  const ctx = canvas.getContext('2d'), img = ctx.createImageData(n, n);
  const lut = []; for (let i = 0; i < 256; i++) lut.push(hex2rgbStr(rampColor(i/255)));
  for (let i = 0; i < n*n; i++) {
    const c = lut[bytes[i]];
    img.data[i*4] = c[0]; img.data[i*4+1] = c[1]; img.data[i*4+2] = c[2]; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

/* re-render on OS theme change and on the artifact viewer's theme toggle */
function watchTheme(render) {
  let raf;
  const redraw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
  new MutationObserver(redraw).observe(document.documentElement,
    { attributes: true, attributeFilter: ['data-theme'] });
}
</script>
